# processo.yaml — o /repro executado pelo runbook, um passo por vez, na mesma conversa do agente;
# com card, termina num comentário nele com as telas: o card real, completo, reescrito com o que a reprodução mostrou.
# Fonte única dos passos do /repro: com o runbook, o motor os executa; sem ele, são seguidos na ordem
# (ver SKILL.md). Uso: runbook run <esta pasta>/processo.yaml --dir <projeto> --relato "<KEY ou descrição>"
nome: repro
descricao: reproduz o relato no front como o usuário, julgado ≥ 90, e — com card — comenta nele a descrição real, completa, com as telas
entrada: [relato]
sessao:
  cli: claude
  permissao: livre
  esforco: medium

resultado: |
  Reprodução, um por defeito: {reproduzir}
  Esperado: {entender.esperava} · causa: {entender.causa}
  Revisão: {revisao.revisao} · dev na parada 1: {parada-1.resposta}

  Card: {entender.card} · comentário: {publicar.url_comentario}

passos:

  - id: setup
    faca: |
      Leia o § Repro de `.claude/ship/setup.md` (e do `setup.local.md`, se existir; o do time vence) — só ele: o board, o status para onde o card vai quando o repro começa, onde reproduzir (local | homolog | prod), a conta base, se pode criar contas de teste e em qual ambiente, o acesso de leitura aos dados reais (skill, CLI ou MCP · ambiente · o que lê).
      A conta base é uma conta de TESTE de `.secrets/test-accounts.md` (papel e ambiente), nunca a conta pessoal do dev nem uma conta de org real. Sem conta de teste que sirva → `pergunta`, e não a pessoal.
      Falta algum → devolva `pergunta` pedindo só o que falta; com a resposta, grave no § Repro — só identificadores e caminhos, nunca senha ou token — e responda.
    exige: { board: texto, status: texto, ambiente: texto, conta_base: texto, criar_contas: texto, acesso_leitura: texto }

  - id: infra
    faca: |
      Leia `.claude/ship/infra.md`: a URL e como subir o ambiente {setup.ambiente}. Falta → rode a skill `furi-ship:infra` (Skill tool) e leia de novo.
    exige: { url: texto, como_subir: texto }

  - id: entender
    faca: |
      O relato: {entrada.relato}
      É a KEY de um card → leia no board {setup.board} o card inteiro, tudo o que ele tem, e mova-o para "{setup.status}".
      É uma descrição → ela é o relato: sem Jira e sem criar card.
      Entenda o problema, ainda sem abrir o navegador: quem, onde, o que faz, o que vê, o que esperava, e a causa provável — no código e nos dados, se precisar.
      Ambiguidade que só o dev resolve → `pergunta`.
      Devolva: tem_card; card (a KEY, ou "nenhum"); o relato literal — o card como está, tudo o que ele diz, sem resumir; a lista dos defeitos que o relato descreve, um por item; e o entendimento.
    exige: { tem_card: booleano, card: texto, relato_literal: texto, defeitos: lista, quem: texto, onde: texto, faz: texto, ve: texto, esperava: texto, causa: texto }

  - id: cenario
    faca: |
      Monte o cenário que o relato pede e abra o navegador nele — um não anda sem o outro. Montar é fazer: criar grupo, usuário, compra, mudar status, o que o bug precisar para acontecer. Primeiro decida o que montar, com qual conta e a tela de partida; o navegador abre já para montá-lo.
      - Onde pode escrever: local e homolog → monte o que precisar. Prod → só dentro do cenário de teste — contas e dados de teste, reaproveitados ou criados para isso —, nunca em usuário ou dado real.
      - Dados reais, só leitura, pelo acesso do § Repro ({setup.acesso_leitura}), se houver: para achar o usuário e o dado do relato e copiar o cenário dele para o de teste. Só consulta (SELECT, GET, logs); nada em nome de usuário real.
      - Efeito que sai do sistema (cobrança real, e-mail ou mensagem a terceiros, nota fiscal) → `pergunta` antes, em qualquer ambiente.
      - A conta: procure em `.secrets/test-accounts.md` uma que sirva e reutilize; crie só se nenhuma serve e o § Repro permite ({setup.criar_contas}), e registre a nova lá (ambiente · papel · login · senha · para quê · criada em), e também o que criou para o cenário (grupo, usuário, pedido), para o próximo run reutilizar. A senha nunca vai na resposta.
      - Acessos (token de MCP ou de API, chave, login): use os de `.secrets/` liberados para teste. Todo acesso que o dev mandar — no relato, numa resposta ou no chat — salve em `.secrets/` na hora (`.secrets/<provedor>.env`, pelo nome da variável; conta em `test-accounts.md`), com `.secrets/` no `.gitignore`. O valor nunca vai na resposta, em print, log ou commit; a resposta cita só o nome.
      - O navegador: pela skill `furi-ship:pwx` (Skill tool) — todo passo no front, daqui em diante, é por ele. Ambiente {setup.ambiente} ({infra.url}); se ele precisar subir: {infra.como_subir}. Entre com a conta do cenário e pare na tela de partida.
    exige: { conta_papel: texto, dados: texto, montagem: lista, acessos: texto, partida: texto }

  - id: reproduzir
    para_cada: entender.defeitos
    faca: |
      Reproduza como o usuário este defeito: {item}
      Pelo front (pwx) quando o trigger tem tela; quando não tem (tool do MCP, API, job), pelo mesmo cliente que o usuário do relato usa, com o antes e o depois que ele vê no front.
      Cenário exato, e DISPARE o trigger: o bug tem de acontecer na sua frente. Uma evidência por passo, inclusive o antes e o depois do trigger (prints em {run.dir}). Não reproduziu → outro caminho, até reproduzir — "não consegui" não existe.
      Em prod, o trigger roda só no cenário de teste; fora dele, em nome de usuário real, ou com efeito que sai do sistema → `pergunta` antes de disparar.
    exige: { ambiente: texto, conta_papel: texto, dados: texto, passos: lista, trigger: texto, aconteceu: texto, evidencias: lista }
    limite: 60m

  - id: julgar-reproducao
    ferramentas: ["Read"]
    juiz: |
      Critério: cada defeito foi reproduzido como o usuário — pelo front ou, se o trigger não tem tela, pelo cliente que o usuário do relato usa — com o trigger disparado, e o que aconteceu é o bug que o entendimento descreve — quem, onde, o que faz, o que vê —, não outro; cenário, passos e evidência o mostram; o registro diz o ambiente, a conta (papel, nunca a senha), os dados e o trigger. Defeito sem reprodução, trigger não disparado, ou resultado que não bate com o entendimento, reprova.
      Relato (literal):
      {entender.relato_literal}
      Defeitos: {entender.defeitos}
      Entendimento: quem {entender.quem} · onde {entender.onde} · faz {entender.faz} · vê {entender.ve} · esperava {entender.esperava} · causa {entender.causa}
      Registro da reprodução, um por defeito: {reproduzir}
      As evidências estão em {run.dir}: abra (Read) as que o registro cita, inclusive os prints, e julgue pelo que mostram; evidência citada que não abre é lacuna.
    ate: 90
    volta_para: reproduzir
    max: 4

  - id: revisao
    faca: |
      Monte numa página só o que o dev aprova na parada: as telas do bug e, com card, o comentário que vai nele. Card: {entender.card}.
      1. As telas. Capture o bug, não o caminho: a tela em que ele aparece — e a do esperado, se ajuda a entender —, como o usuário, no navegador. Em cada uma, marque o ponto do bug com `pwx mark <ref> "BUG"` antes do `pwx screenshot` e tire a marca depois (`pwx mark --hide`). O ponto marcado tem de ser legível sem zoom: se some na tela inteira, capture o recorte em volta dele (`pwx screenshot <ref do container>`). Nome que diz o que mostra; prints em {run.dir}.
      2. O comentário — sem card, pule. É o card real, completo: o card inteiro reescrito como PM/PO, no idioma dele, com o que a reprodução mostrou, para quem não viu esta conversa. O que o card já diz certo entra também; o que ele diz errado ou não diz entra corrigido.
      O card, como está:
      {entender.relato_literal}
      Abre com `Descrição real — <data de hoje>` e segue: Contexto (quem, onde, impacto) · Problema real (o que o card diz × o que acontece, a causa) · Objetivo (o pronto observável) · Critérios de aceite · Referências visuais (cada tela embutida e, embaixo, o que mostra) · Como testar (pré-condição → passos → resultado — os que de fato reproduziram). Diz o quê, por quê e como se confere, nunca como se faz.
      Grave em `{run.dir}/comentario.txt`, já em wiki markup do Jira, como vai ser publicado — Markdown não embute imagem no Jira: `*negrito*`, `{{{{código}}}}`, `*`/`#` listas, `!arquivo.png|width=900!` para cada tela.
      3. A página. Monte `{run.dir}/revisao.html`, para o dev aprovar tudo batendo o olho: com card, a prévia do comentário — o texto renderizado como o Jira vai mostrá-lo, com cada tela no lugar dela; sem card, só as telas. Em cada tela, o número grande (`Imagem N`), o print com o ponto do bug marcado e, embaixo, em vermelho, o defeito e o que a imagem mostra. Imagens por caminho relativo, na mesma pasta; página simples, legível, sem dependência externa. Abra-a no navegador padrão do dev (`open` no macOS, `xdg-open` no Linux) e escreva a mensagem da parada: onde a revisão está e as imagens, uma por linha (`Imagem N — o que mostra`).
    exige: { telas: lista, revisao: texto, mensagem: texto }

  - id: parada-1
    parada: |
      {revisao.mensagem}

      "Tudo ok" aprova: cada imagem mostra o bug e, com card, o comentário vai para ele como está na revisão. Qualquer outra resposta volta para a reprodução com o que você disser — diga qual imagem e por quê ("2 reprovada: …").
    segue: Tudo ok
    volta_para: reproduzir

  - id: publicar
    se: entender.tem_card
    faca: |
      No card {entender.card}: anexe as telas ({revisao.telas}) e publique `{run.dir}/comentario.txt` como está — é o texto que o dev aprovou. A descrição, o título e os campos ficam intocados.
      Anexe pelo MCP do Jira: ele só aceita arquivo de dentro da pasta da sessão que o chama (o diretório de trabalho do chat ou do agente, não necessariamente o projeto) — copie as telas para uma pasta temporária ali e apague-a depois.
      Publique pela API v2 (`/rest/api/2/issue/<KEY>/comment`), que recebe o wiki markup — pelo MCP a imagem não fica embutida —, com as credenciais que o MCP do Jira já usa, nunca impressas.
    exige: { url_comentario: texto, anexos: lista }

  - id: reler
    se: entender.tem_card
    faca: |
      Releia o card {entender.card} publicado: o comentário renderiza, as telas aparecem, a descrição não mudou. Confira pelo HTML renderizado (API v3, `?expand=renderedBody`), não pelo retorno do MCP, que é uma reconversão: cada tela vira `<img>` do anexo, e não sobra `{{{{`, `\[` ou `!` literal. Achou problema → corrija e releia antes de responder.
    exige: { conferencia: texto }
