# processo.yaml — o /repro executado pelo runbook, um passo por vez, na mesma conversa do agente;
# com card, termina no /recard: a descrição real vira um comentário no card, com as telas.
# Fonte única dos passos do /repro: com o runbook, o motor os executa; sem ele, são seguidos na ordem
# (ver SKILL.md). Uso: runbook run <esta pasta>/processo.yaml --dir <projeto> --relato "<KEY ou descrição>"
nome: repro
descricao: reproduz o relato no front como o usuário, julgado ≥ 90, e — com card — comenta nele a descrição real com as telas
entrada: [relato]
sessao:
  cli: claude
  permissao: livre
  esforco: medium

resultado: |
  Reprodução, um por defeito: {reproduzir}
  Esperado: {entender.esperava} · causa: {entender.causa}
  Revisão: {telas.revisao} · dev na parada 1: {parada-1.resposta}

  Card: {entender.card} · comentário: {publicar.url_comentario}

passos:
  # ── o /repro ──────────────────────────────────────────────────────────────

  - id: setup
    faca: |
      Leia o § Repro de `.claude/ship/setup.md` (e do `setup.local.md`, se existir; o do time vence) — só ele: o board, o status para onde o card vai quando o repro começa, onde reproduzir (local | homolog | prod), a conta base, se pode criar contas de teste e em qual ambiente, o acesso de leitura aos dados reais (skill, CLI ou MCP · ambiente · o que lê).
      Falta algum → devolva `pergunta` pedindo só o que falta; com a resposta, grave no § Repro — só identificadores e caminhos, nunca senha ou token — e responda.
    exige: { board: texto, status: texto, ambiente: texto, conta_base: texto, criar_contas: texto, acesso_leitura: texto }

  - id: infra
    faca: |
      Leia `.claude/ship/infra.md`: a URL e como subir o ambiente {setup.ambiente}. Falta → rode a skill `furi-ship:infra` (Skill tool) e leia de novo.
    exige: { url: texto, como_subir: texto }

  - id: entender
    faca: |
      O relato: {entrada.relato}
      É a KEY de um card → leia no board {setup.board} o card inteiro, tudo o que ele tem, e mova-o para "{setup.status}".
      É uma descrição → ela é o relato: sem Jira e sem criar card.
      Entenda o problema, ainda sem abrir o navegador: quem, onde, o que faz, o que vê, o que esperava, e a causa provável — no código e nos dados, se precisar.
      Ambiguidade que só o dev resolve → `pergunta`.
      Devolva: tem_card; card (a KEY, ou "nenhum"); ferramentas_card — os nomes exatos das ferramentas de leitura que você usou para ler o card (vazio sem card); o relato literal — o card como está, tudo o que ele diz, sem resumir; a lista dos defeitos que o relato descreve, um por item; e o entendimento.
    exige: { tem_card: booleano, card: texto, ferramentas_card: lista, relato_literal: texto, defeitos: lista, quem: texto, onde: texto, faz: texto, ve: texto, esperava: texto, causa: texto }

  - id: julgar-entendimento
    ferramentas: ["{entender.ferramentas_card}"]
    juiz: |
      Critério: o entendimento explica o relato inteiro — cada defeito, quem, onde, o que faz, o que vê e o que esperava — sem contradizê-lo nem acrescentar o que ele não diz; a causa é plausível pelo que está escrito.
      O relato, como o dev mandou: {entrada.relato}
      É a KEY de um card → leia-o você mesmo, inteiro, pelas ferramentas, e julgue contra ele. É uma descrição → ela é a fonte: julgue contra ela.
      Defeitos: {entender.defeitos}
      Entendimento: quem {entender.quem} · onde {entender.onde} · faz {entender.faz} · vê {entender.ve} · esperava {entender.esperava} · causa {entender.causa}
    ate: 90
    max: 4

  - id: cenario
    faca: |
      Monte o cenário que o relato pede e abra o navegador nele — um não anda sem o outro. Montar é fazer: criar grupo, usuário, compra, mudar status, o que o bug precisar para acontecer. Primeiro decida o que montar, com qual conta e a tela de partida; o navegador abre já para montá-lo.
      - Onde pode escrever: local e homolog → monte o que precisar. Prod → só dentro do cenário de teste — contas e dados de teste, reaproveitados ou criados para isso —, nunca em usuário ou dado real.
      - Dados reais, só leitura, pelo acesso do § Repro ({setup.acesso_leitura}), se houver: para achar o usuário e o dado do relato e copiar o cenário dele para o de teste. Só consulta (SELECT, GET, logs); nada em nome de usuário real.
      - Efeito que sai do sistema (cobrança real, e-mail ou mensagem a terceiros, nota fiscal) → `pergunta` antes, em qualquer ambiente.
      - A conta: procure em `.secrets/test-accounts.md` uma que sirva e reutilize; crie só se nenhuma serve e o § Repro permite ({setup.criar_contas}), e registre a nova lá (ambiente · papel · login · senha · para quê · criada em), e também o que criou para o cenário (grupo, usuário, pedido), para o próximo run reutilizar. A senha nunca vai na resposta.
      - Acessos (token de MCP ou de API, chave, login): use os de `.secrets/` liberados para teste. Todo acesso que o dev mandar — no relato, numa resposta ou no chat — salve em `.secrets/` na hora (`.secrets/<provedor>.env`, pelo nome da variável; conta em `test-accounts.md`), com `.secrets/` no `.gitignore`. O valor nunca vai na resposta, em print, log ou commit; a resposta cita só o nome.
      - O navegador: pela skill `furi-ship:pwx` (Skill tool) — todo passo no front, daqui em diante, é por ele. Ambiente {setup.ambiente} ({infra.url}); se ele precisar subir: {infra.como_subir}. Entre com a conta do cenário e pare na tela de partida.
    exige: { conta_papel: texto, dados: texto, montagem: lista, acessos: texto, partida: texto }

  - id: reproduzir
    para_cada: entender.defeitos
    faca: |
      Reproduza no front, como o usuário, pelo pwx, este defeito: {item}
      Cenário exato, e DISPARE o trigger: o bug tem de acontecer na sua frente. Uma evidência por passo, inclusive o antes e o depois do trigger (prints em {run.dir}). Não reproduziu → outro caminho, até reproduzir — "não consegui" não existe.
      Em prod, o trigger roda só no cenário de teste; fora dele, em nome de usuário real, ou com efeito que sai do sistema → `pergunta` antes de disparar.
    exige: { ambiente: texto, conta_papel: texto, dados: texto, passos: lista, trigger: texto, aconteceu: texto, evidencias: lista }
    limite: 60m

  - id: julgar-reproducao
    juiz: |
      Critério: cada defeito foi reproduzido no front com o trigger disparado, e o que aconteceu é o bug que o entendimento descreve — quem, onde, o que faz, o que vê —, não outro; cenário, passos e evidência o mostram; o registro diz o ambiente, a conta (papel, nunca a senha), os dados e o trigger. Defeito sem reprodução, trigger não disparado, ou resultado que não bate com o entendimento, reprova.
      Relato (literal):
      {entender.relato_literal}
      Defeitos: {entender.defeitos}
      Entendimento: quem {entender.quem} · onde {entender.onde} · faz {entender.faz} · vê {entender.ve} · esperava {entender.esperava} · causa {entender.causa}
      Registro da reprodução, um por defeito: {reproduzir}
    ate: 90
    volta_para: reproduzir
    max: 4

  - id: telas
    faca: |
      Capture o bug, não o caminho: a tela em que ele aparece — e a do esperado, se ajuda a entender —, como o usuário, no navegador. Em cada uma, marque o ponto do bug com `pwx mark <ref> "BUG"` antes do `pwx screenshot` e tire a marca depois (`pwx mark --hide`). O ponto marcado tem de ser legível sem zoom: se some na tela inteira, capture o recorte em volta dele (`pwx screenshot <ref do container>`). Nome que diz o que mostra; prints em {run.dir}.
      Monte `{run.dir}/revisao.html`, para o dev aprovar batendo o olho: para cada print, o número grande (`Imagem N`), o print com o ponto do bug marcado e, embaixo, em vermelho, o defeito e o que a imagem mostra. Imagens por caminho relativo, na mesma pasta; página simples, legível, sem dependência externa.
    exige: { telas: lista, revisao: texto }

  - id: mostrar
    faca: |
      Mostre ao dev as duas coisas, antes da parada:
      1. A revisão: abra {telas.revisao} no navegador padrão do dev (`open` no macOS, `xdg-open` no Linux) — os prints com o bug marcado, numerados.
      2. O bug ao vivo: no pwx, remonte o cenário — desfaça no front o que o trigger mudou, se precisar — e deixe o navegador um passo antes do trigger.
      Escreva a mensagem para o dev: a revisão aberta e onde está; as imagens, uma por linha (`Imagem N — o que mostra`); e "👉 Para ver ao vivo, clique em: [elemento exato]".
    exige: { revisao_aberta: texto, ao_vivo: texto, mensagem: texto }

  - id: parada-1
    parada: |
      {mostrar.mensagem}

      Responda por imagem — "1 ok, 2 ok, 3 reprovada: <por quê>" —, "tudo ok" ou "tudo reprovado". Ok = a imagem mostra o bug.

  - id: aprovar
    juiz: |
      Critério: o dev aprovou todas as imagens da revisão. Imagem reprovada, ou sem resposta clara, reprova; cada lacuna diz qual imagem e o motivo, nas palavras dele.
      Imagens: {telas.telas}
      Resposta do dev: {parada-1.resposta}
    ate: 90
    volta_para: reproduzir
    max: 3

  # ── o /recard: com card e as telas aprovadas, a descrição real vira um comentário nele ─

  - id: comentario
    se: entender.tem_card
    faca: |
      Escreva, como PM/PO, no idioma do card que você leu, o comentário para quem não viu esta conversa.
      Abre com `Descrição real — <data de hoje>` e segue: Contexto (quem, onde, impacto) · Problema real (o que o card diz × o que acontece, a causa) · Objetivo (o pronto observável) · Critérios de aceite · Referências visuais (as telas) · Como testar (pré-condição → passos → resultado).
      Diz o quê, por quê e como se confere, nunca como se faz.
    exige: { comentario: texto }

  - id: publicar
    se: entender.tem_card
    faca: |
      No card {entender.card}: anexe as telas aprovadas ({telas.telas}) e publique o comentário com elas inline. A descrição, o título e os campos ficam intocados.
      O MCP do Jira só aceita arquivo de dentro do projeto: copie as telas para uma pasta temporária do projeto e apague-a depois.
    exige: { url_comentario: texto, anexos: lista }

  - id: reler
    se: entender.tem_card
    faca: |
      Releia o card {entender.card} publicado: o comentário renderiza, as telas aparecem, a descrição não mudou. Achou problema → corrija e releia antes de responder.
    exige: { conferencia: texto }
